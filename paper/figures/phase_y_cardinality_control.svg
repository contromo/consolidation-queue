<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390">
  <rect width="960" height="390" fill="#ffffff"/>
  <text x="40" y="42" font-family="Arial, sans-serif" font-size="24" font-weight="700">Phase Y cardinality control</text>
  <text x="40" y="70" font-family="Arial, sans-serif" font-size="15" fill="#333333">Plural CQ readout closes the gap; capped Reflection recreates it.</text>
  <g font-family="Arial, sans-serif" font-size="15">
    <rect x="70" y="115" width="170" height="80" rx="8" fill="#f6dede" stroke="#b84a4a"/>
    <text x="106" y="148">Base CQ</text><text x="107" y="172">0/71 all-hit</text>
    <rect x="300" y="115" width="190" height="80" rx="8" fill="#dff2df" stroke="#4f8f4f"/>
    <text x="333" y="148">Plural pending CQ</text><text x="353" y="172">71/71 all-hit</text>
    <rect x="550" y="115" width="170" height="80" rx="8" fill="#dff2df" stroke="#4f8f4f"/>
    <text x="586" y="148">Reflection</text><text x="592" y="172">71/71 all-hit</text>
    <rect x="770" y="115" width="170" height="80" rx="8" fill="#f6dede" stroke="#b84a4a"/>
    <text x="795" y="148">Capped Reflection</text><text x="812" y="172">0/71 all-hit</text>
    <path d="M240 155 L300 155" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M720 155 L770 155" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="305" y="245" font-size="16" font-weight="700">Mechanism isolated: answer-time evidence cardinality</text>
    <text x="245" y="278" fill="#333333">No storage change, no adapter change, no judge change, no headline metric change.</text>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333333"/></marker></defs>
</svg>
